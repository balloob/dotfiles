# Global runtime and CLI tool versions.
# install.sh symlinks this to ~/.config/mise/conf.d/dotfiles.toml, so the same
# tools are available on macOS and Linux without duplicating them in Brewfile
# and apt.
#
# `mise use -g` adds a new tool to ~/.config/mise/config.toml, which is
# machine-local and not tracked. For a tool listed here, it edits this file.
# Add tools that every machine needs to this file by hand.
#
# Install everything declared here with: mise install

[settings]
# Use .nvmrc and .go-version files in projects. Python is left out because uv
# reads .python-version itself.
idiomatic_version_file_enable_tools = ["go", "node"]

[tools]
# Runtimes
node = "lts"
go = "latest"
rust = "latest"

# CLI tools
cloudflared = "latest"
delta = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"
mosh = "latest"
pnpm = "latest"
ripgrep = "latest"
tmux = "latest"
topgrade = "latest"
